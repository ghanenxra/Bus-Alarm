services:
  - type: web
    name: bus-alarm-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/ready
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SYNC_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: DEFAULT_POLL_INTERVAL_SECONDS
        value: 10
      - key: DEVICE_AUTH_ENABLED
        value: true
      - key: FCM_ENABLED
        value: false
